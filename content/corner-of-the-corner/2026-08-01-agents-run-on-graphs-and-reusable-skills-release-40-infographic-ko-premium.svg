<svg width="2048" height="1152" viewBox="0 0 2048 1152" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">에이전트는 그래프와 스킬 자산 위에서 굴러간다 고급형 한국어 인포그래픽</title>
  <desc id="desc">Lovart로 제작된 프리미엄 테크 인포그래픽을 바탕으로 한국어 타이포그래피를 덧입힌 하이브리드 인포그래픽</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F7FAFF" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="glassSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#FBFDFF" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#173A6A" flood-opacity="0.14"/>
    </filter>
    <style>
      .kr { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .eyebrow { font-size: 28px; font-weight: 800; letter-spacing: 0.12em; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: -0.03em; }
      .hero { font-size: 72px; font-weight: 900; letter-spacing: -0.05em; }
      .heroSmall { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
      .body { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
      .small { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; }
      .tiny { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
      .white { fill: #FFFFFF; }
      .navy { fill: #0D2A5C; }
      .ink { fill: #14305F; }
      .inkSoft { fill: #3E557E; }
      .orange { fill: #F57C1F; }
    </style>
  </defs>

  <image href="./2026-08-01-agents-run-on-graphs-and-reusable-skills-release-40-infographic.png" x="0" y="0" width="2048" height="1152" preserveAspectRatio="xMidYMid slice"/>

  <rect x="18" y="18" width="620" height="80" rx="18" fill="#0D2A5C"/>
