<svg width="1672" height="941" viewBox="0 0 1672 941" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">에이전트는 운영체계가 되고 산출물은 바로 실행된다는 이번 글의 흐름을 한눈에 보여주는 인포그래픽</title>
  <desc id="desc">운영 구조에서 현장 파일 자동화, 실행 가능한 결과물, 인간 판단층까지 이어지는 네 단계 흐름을 보여주는 인포그래픽</desc>
  <defs>
    <linearGradient id="titleGlow" x1="118" y1="86" x2="940" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F8FF"/>
      <stop offset="0.6" stop-color="#A8D7FF"/>
      <stop offset="1" stop-color="#72F0E4"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A1930" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0B223F" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#61EAFF"/>
      <stop offset="0.48" stop-color="#8DBAFF"/>
      <stop offset="1" stop-color="#76FFD4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020812" flood-opacity="0.42"/>
    </filter>
    <style>
      .kr { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", "Menlo", monospace; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.16em; }
      .title { font-size: 60px; font-weight: 900; letter-spacing: -0.055em; }
      .subtitle { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
      .stepNo { font-size: 21px; font-weight: 800; letter-spacing: 0.16em; }
      .stepTitle { font-size: 38px; font-weight: 900; letter-spacing: -0.03em; }
      .stepBody { font-size: 18px; font-weight: 750; letter-spacing: -0.01em; }
      .chip { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
      .bottom { font-size: 19px; font-weight: 850; letter-spacing: -0.02em; }
      .white { fill: #F5FAFF; }
      .ink { fill: #DCEEFF; }
      .muted { fill: #A8C3DB; }
      .accent { fill: #77E5FF; }
      .mint { fill: #74FFD8; }
    </style>
  </defs>

  <image href="./2026-08-15-agents-become-operating-systems-and-outputs-run-immediately-release-40-infographic.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1672" height="941" fill="#031120" fill-opacity="0.54"/>

  <rect x="74" y="34" width="1524" height="164" rx="30" fill="url(#panelFill)" stroke="#88D6FF" stroke-opacity="0.30" filter="url(#shadow)"/>
  <text x="118" y="88" class="mono eyebrow accent">RELEASE 40 AT A GLANCE</text>
  <text x="118" y="142" class="kr title" fill="url(#titleGlow)">에이전트는 운영체계가 되고</text>
  <text x="118" y="198" class="kr title" fill="url(#titleGlow)">산출물은 바로 실행된다</text>

  <rect x="74" y="220" width="1524" height="78" rx="24" fill="#08192E" fill-opacity="0.96" stroke="#88D6FF" stroke-opacity="0.22" filter="url(#shadow)"/>
  <text x="118" y="268" class="kr subtitle ink">구조  →  문서  →  실행  →  판단</text>

  <rect x="74" y="330" width="1524" height="434" rx="32" fill="#07172C" fill-opacity="0.96" stroke="#83D5FF" stroke-opacity="0.20" filter="url(#shadow)"/>

  <rect x="106" y="360" width="706" height="168" rx="28" fill="url(#panelFill)" stroke="#83D5FF" stroke-opacity="0.30"/>
  <text x="142" y="406" class="mono stepNo accent">STEP 01</text>
  <text x="142" y="462" class="kr stepTitle white">운영 구조</text>
  <text x="142" y="506" class="kr stepBody ink">스킬 · 브리지 · 메모리 · 서브에이전트</text>
  <text x="142" y="538" class="kr chip muted">SYSTEM LAYER</text>

  <rect x="860" y="360" width="706" height="168" rx="28" fill="url(#panelFill)" stroke="#83D5FF" stroke-opacity="0.30"/>
  <text x="896" y="406" class="mono stepNo accent">STEP 02</text>
  <text x="896" y="462" class="kr stepTitle white">현장 파일</text>
  <text x="896" y="506" class="kr stepBody ink">구글시트 · HWP · PDF · 학생부</text>
  <text x="896" y="538" class="kr chip muted">WORK FILES</text>

  <rect x="106" y="566" width="706" height="168" rx="28" fill="url(#panelFill)" stroke="#83D5FF" stroke-opacity="0.30"/>
  <text x="142" y="612" class="mono stepNo accent">STEP 03</text>
  <text x="142" y="668" class="kr stepTitle white">실행 결과물</text>
  <text x="142" y="712" class="kr stepBody ink">사이트 · 대시보드 · 3D · 모바일 QA</text>
  <text x="142" y="744" class="kr chip muted">LIVE SURFACES</text>

  <rect x="860" y="566" width="706" height="168" rx="28" fill="url(#panelFill)" stroke="#83D5FF" stroke-opacity="0.30"/>
  <text x="896" y="612" class="mono stepNo mint">STEP 04</text>
  <text x="896" y="668" class="kr stepTitle white">인간 판단층</text>
  <text x="896" y="712" class="kr stepBody ink">질문 · 구조화 · 검토 · 문체 다듬기</text>
  <text x="896" y="744" class="kr chip muted">HUMAN CHECK</text>

  <path d="M812 444H860" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M812 650H860" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M789 528V566" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M765 544L789 570L813 544" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M836 430L860 444L836 458" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M836 636L860 650L836 664" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="74" y="798" width="1524" height="98" rx="28" fill="url(#panelFill)" stroke="#83D5FF" stroke-opacity="0.25" filter="url(#shadow)"/>
  <text x="112" y="842" class="mono eyebrow accent">FLOW SIGNAL</text>
  <text x="112" y="878" class="kr bottom white">모델 경쟁  →  운영 구조  →  파일 자동화  →  실행 표면  →  최종 판단</text>
</svg>
