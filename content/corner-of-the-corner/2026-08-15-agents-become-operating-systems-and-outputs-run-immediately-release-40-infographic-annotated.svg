<svg width="1672" height="941" viewBox="0 0 1672 941" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">에이전트는 운영체계가 되고 산출물은 바로 실행된다는 이번 글의 논지를 반영한 인포그래픽</title>
  <desc id="desc">왼쪽은 에이전트 운영 구조, 가운데는 현장 문서 자동화, 오른쪽은 실행 가능한 결과물, 하단은 인간 판단층을 보여주는 인포그래픽</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061629" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0B1D35" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEF6FF"/>
      <stop offset="0.52" stop-color="#85C9FF"/>
      <stop offset="1" stop-color="#67F3E7"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6BEAFF"/>
      <stop offset="0.5" stop-color="#7DB4FF"/>
      <stop offset="1" stop-color="#79FFD1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020812" flood-opacity="0.42"/>
    </filter>
    <style>
      .kr { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", "Menlo", monospace; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; }
      .title { font-size: 64px; font-weight: 900; letter-spacing: -0.05em; }
      .subtitle { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
      .panelTitle { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      .panelBody { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
      .small { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
      .white { fill: #F5FAFF; }
      .ink { fill: #DBF2FF; }
      .muted { fill: #A8C3DB; }
      .accent { fill: #74E5FF; }
      .mint { fill: #71FFD8; }
    </style>
  </defs>

  <image href="./2026-08-15-agents-become-operating-systems-and-outputs-run-immediately-release-40-infographic.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>

  <rect x="74" y="36" width="1524" height="164" rx="28" fill="url(#panel)" stroke="#81D0FF" stroke-opacity="0.28" filter="url(#shadow)"/>
  <text x="116" y="88" class="mono eyebrow accent">RELEASE 40 SNAPSHOT</text>
  <text x="116" y="148" class="kr title" fill="url(#titleGlow)">에이전트는 운영체계가 되고</text>
  <text x="116" y="212" class="kr title" fill="url(#titleGlow)">산출물은 바로 실행된다</text>
  <text x="116" y="252" class="kr subtitle ink">스킬과 브리지가 운영 구조를 만들고, 현장 문서와 웹 결과물이 바로 실행면으로 이어지며, 마지막 경쟁력은 사람의 판단층에 남는다.</text>
  <rect x="116" y="276" width="1440" height="6" rx="3" fill="url(#accentLine)" opacity="0.92"/>

  <rect x="84" y="230" width="388" height="116" rx="22" fill="url(#panel)" stroke="#7FCEFF" stroke-opacity="0.24" filter="url(#shadow)"/>
  <text x="110" y="276" class="mono small accent">LAYER 01</text>
  <text x="110" y="312" class="kr panelTitle white">운영 구조가 본체가 된다</text>
  <text x="110" y="338" class="kr panelBody muted">스킬 · 브리지 · 메모리 · 서브 에이전트</text>

  <rect x="642" y="230" width="388" height="116" rx="22" fill="url(#panel)" stroke="#7FCEFF" stroke-opacity="0.24" filter="url(#shadow)"/>
  <text x="668" y="276" class="mono small accent">LAYER 02</text>
  <text x="668" y="312" class="kr panelTitle white">현장 파일이 자동화 중심으로</text>
  <text x="668" y="338" class="kr panelBody muted">구글시트 · HWP · PDF · 학생부</text>

  <rect x="1188" y="230" width="400" height="116" rx="22" fill="url(#panel)" stroke="#7FCEFF" stroke-opacity="0.24" filter="url(#shadow)"/>
  <text x="1214" y="276" class="mono small accent">LAYER 03</text>
  <text x="1214" y="312" class="kr panelTitle white">읽는 문서가 실행면으로 이동</text>
  <text x="1214" y="338" class="kr panelBody muted">사이트 · 대시보드 · 3D · 모바일 QA</text>

  <rect x="484" y="818" width="704" height="88" rx="24" fill="url(#panel)" stroke="#7FCEFF" stroke-opacity="0.22" filter="url(#shadow)"/>
  <text x="836" y="854" text-anchor="middle" class="mono small mint">HUMAN JUDGMENT LAYER</text>
  <text x="836" y="890" text-anchor="middle" class="kr panelTitle white">마지막 경쟁력은 질문 · 구조화 · 검토 · 문체 다듬기</text>
</svg>
