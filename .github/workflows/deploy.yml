name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # A newer verified push must supersede an older Pages deployment.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npm run quartz -- build
      - name: Validate generated site
        run: |
          test -f public/index.html
          test "$(find public -type f | wc -l | tr -d ' ')" -gt 0
          echo "Generated files: $(find public -type f | wc -l | tr -d ' ')"
          du -sh public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    # actions/deploy-pages defaults to a 10-minute API timeout. GitHub Pages
    # can spend longer in syncing_files even when the artifact is valid.
    timeout-minutes: 40
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 30 minutes for the Pages service to finish syncing the artifact.
          timeout: 1800000
          error_count: 20

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published homepage
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --location --retry 12 --retry-delay 10 --retry-all-errors \
            --silent --show-error --output /tmp/home.html "$PAGE_URL"
          grep -q '<html' /tmp/home.html
          echo "Published URL verified: $PAGE_URL"
